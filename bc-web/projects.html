<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>projects — bianca cardona</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Projects page layout */
    main.projects { max-width: 1120px; margin: 0 auto; padding: 24px 28px 64px; }
    .projects > h1 { text-align:center; margin: 0; font-size: clamp(2.8rem, 7vw, 5rem); line-height:1.05; }
    .projects > .projects-intro { text-align:center; margin: 8px 0 64px; color:#b17e7c; font-size:clamp(1.15rem, 3vw, 1.8rem); }
    .projects-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:28px 40px; align-items:stretch; }
    .project-card { box-sizing:border-box; min-width:0; padding:22px 22px 28px; border:3px solid #e2d9dc; border-radius:12px; background:rgba(255,255,255,.68); text-align:center; display:flex; flex-direction:column; }
    .project-meta { display:flex; justify-content:space-between; gap:12px; border-bottom:2px solid #bba4a5; padding-bottom:10px; margin-bottom:24px; color:#9a898b; font-size:clamp(.95rem,2.3vw,1.35rem); }
    .project-tags { font-style:italic; text-align:left; }
    .project-year { white-space:nowrap; }
    .project-image { width:100%; aspect-ratio: 1.8 / 1; overflow:hidden; margin-bottom:24px; background:#eee; }
    .project-image img { display:block; width:100%; height:100%; object-fit:cover; }
    .project-title { margin:0 0 12px; font-size:clamp(1.5rem,3.2vw,2.25rem); line-height:1.15; color:#725b5b; }
    .project-description { margin:0; color:#b17e7c; font-size:clamp(1rem,2.4vw,1.45rem); line-height:1.35; }
    .project-description::before { content:">> "; font-weight:600; }
    @media (max-width:650px) {
      main.projects { padding:20px 16px 48px; }
      .projects > .projects-intro { margin-bottom:36px; }
      .projects-grid { grid-template-columns:1fr; gap:22px; }
      .project-card { padding:18px 16px 24px; }
    }
  </style>
</head>
<body>
  <header class="nav">
    <span class="logo">B.C.</span>
    <nav class="nav-links">
      <a href="index.html">about</a>
      <a href="projects.html" aria-current="page">projects</a>
      <a href="blog/">blog</a>
      <a href="hobbies.html">hobbies</a>
    </nav>
  </header>

  <main class="projects">
    <h1>projects</h1>
    <p class="projects-intro">check out what i've made!</p>
    <section class="projects-grid" id="projects-grid" aria-label="Projects"></section>
  </main>

  <script>
    /*
      Add projects by adding another object to this array.
      Each object becomes a card; CSS automatically lays cards out in two columns
      and wraps additional projects onto new rows.
    */
    const projects = [
      {
        title: "receipt wrapped",
        tags: "CSS • JavaScript",
        year: "2026",
        image: "assets/reciept_wrapped_demo.gif",
        imageAlt: "Receipt Wrapped result screen: Boba Goblin spending personality",
        description: "spotify wrapped, but for your weekly purchase history... find out what type of spender you are!"
      },
      {
        title: "cams cart",
        tags: "Blender • Lua",
        year: "2025",
        image: "assets/cams-cart.gif",
        imageAlt: "Cams Cart game screenshot",
        description: "mario kart themed after my high school's mascots"
      }
      // Example: add a third project below this line, separated by a comma:
      // { title: "my next project", tags: "Python • HTML", year: "2026",
      //   image: "assets/my-project.png", imageAlt: "Screenshot of my project",
      //   description: "a short description of what it does" }
    ];

    const grid = document.getElementById("projects-grid");
    grid.innerHTML = projects.map(project => `
      <article class="project-card">
        <div class="project-meta">
          <span class="project-tags">${project.tags}</span>
          <span class="project-year">${project.year}</span>
        </div>
        <div class="project-image">
          <img src="${project.image}" alt="${project.imageAlt || project.title}" loading="lazy">
        </div>
        <h2 class="project-title">${project.title}</h2>
        <p class="project-description">${project.description}</p>
        ${project.extra ? `<p class="project-description" style="margin-top:8px">${project.extra}</p>` : ""}
      </article>
    `).join("");
  </script>
  <script src="script.js"></script>
  <script src="cursor-trail.js"></script>
</body>
</html>
